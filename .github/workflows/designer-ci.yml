name: designer-ci
# A run on main fills the ccache that pull requests start from.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: designer-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
          libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
          libfontconfig1-dev xvfb ninja-build
    - name: Install Skia
      run: |
        skia_url=$(bash laf/misc/skia-url.sh release linux x64 | xargs)
        curl -L -o skia.zip "$skia_url"
        unzip -q skia.zip -d skia
    - uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        key: designer-ci-linux
    - name: Configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DENABLE_CCACHE=on \
          -DENABLE_TESTS=on \
          -DLAF_BACKEND=skia \
          -DSKIA_DIR=$PWD/skia \
          -DSKIA_LIBRARY_DIR=$PWD/skia/out/Release-x64
    - name: Build
      run: ninja -C build aseprite tree_widget_tests settings_import_tests
    - name: Unit tests
      run: |
        build/bin/tree_widget_tests
        build/bin/settings_import_tests
    - name: Script tests
      run: |
        export ASEPRITE=$PWD/build/bin/aseprite
        cd tests
        xvfb-run -a bash run-tests.sh
