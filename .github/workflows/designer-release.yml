name: designer-release
on:
  push:
    tags: ['v*-designer.*']
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          platform: macos
          arch: arm64
          package: Nordtal-Designer-macOS-arm64.zip
        - os: windows-latest
          platform: windows
          arch: x64
          package: Nordtal-Designer-Windows-x64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Install Skia
      run: |
        skia_url=$(bash laf/misc/skia-url.sh release ${{ matrix.platform }} ${{ matrix.arch }} | xargs)
        curl --ssl-revoke-best-effort -L -o skia.zip "$skia_url"
        unzip -q skia.zip -d skia
    - uses: aseprite/get-ninja@main
    - uses: TheMrMilchmann/setup-msvc-dev@v4
      if: runner.os == 'Windows'
      with:
        arch: x64
    - name: Configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DENABLE_CCACHE=off \
          -DLAF_BACKEND=skia \
          -DSKIA_DIR="$(pwd)/skia" \
          -DSKIA_LIBRARY_DIR="$(pwd)/skia/out/Release-${{ matrix.arch }}"
    - name: Build
      run: ninja -C build aseprite
    - name: Package
      run: |
        if [[ "${{ runner.os }}" == "macOS" ]] ; then
          ditto -c -k --keepParent "build/bin/Nordtal Designer.app" "${{ matrix.package }}"
        else
          mkdir -p "package/Nordtal Designer"
          cp "build/bin/Nordtal Designer.exe" "package/Nordtal Designer/"
          cp -r build/bin/data "package/Nordtal Designer/"
          cd package && 7z a "../${{ matrix.package }}" "Nordtal Designer"
        fi
    - name: Attach to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "" || true
        gh release upload "$GITHUB_REF_NAME" "${{ matrix.package }}" --clobber
