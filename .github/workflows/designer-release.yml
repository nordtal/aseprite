name: designer-release
# A tag builds both packages for its release. A manual run builds the
# chosen platforms from any branch and keeps the packages as artifacts.
# Only the job that attaches the packages can write to the repository.
on:
  push:
    tags: ['v*-designer.*']
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [all, macos, windows]
        default: all
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      # An include for a platform that isn't in the list would add a
      # job of its own, so the values per platform are expressions.
      matrix:
        platform: ${{ fromJSON((inputs.platform == '' || inputs.platform == 'all') && '["macos","windows"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.platform }}-latest
    env:
      ARCH: ${{ matrix.platform == 'macos' && 'arm64' || 'x64' }}
      PACKAGE: Nordtal-Designer-${{ matrix.platform == 'macos' && 'macOS-arm64' || 'Windows-x64' }}.zip
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
    # The same rule as parseTag() in nordtal-bootstrap/season.lua, so
    # that every release tag is one the designer updates to
    - name: Check the tag
      if: github.event_name == 'push'
      run: |
        [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)*-designer\.[0-9]+$ ]] || {
          echo "$GITHUB_REF_NAME isn't v<aseprite version>-designer.<n> with numbers only"
          exit 1
        }
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Install Skia
      run: |
        skia_url=$(bash laf/misc/skia-url.sh release ${{ matrix.platform }} ${{ env.ARCH }} | xargs)
        curl --ssl-revoke-best-effort -L -o skia.zip "$skia_url"
        unzip -q skia.zip -d skia
    - uses: aseprite/get-ninja@27788a2a3a1d6106713702d6741e4ee95f3cc10a # main
    - uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
      if: runner.os == 'Windows'
      with:
        arch: x64
    - name: Configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
          -DENABLE_CCACHE=off \
          -DLAF_BACKEND=skia \
          -DSKIA_DIR="$(pwd)/skia" \
          -DSKIA_LIBRARY_DIR="$(pwd)/skia/out/Release-${{ env.ARCH }}"
    - name: Build
      run: ninja -C build aseprite
    - name: Package
      run: |
        # A package of a tag knows the tag and updates itself to newer
        # releases; a manual run's doesn't
        release() {
          if [[ "${{ github.event_name }}" == "push" ]] ; then
            echo "$GITHUB_REF_NAME" > "$1/extensions/nordtal-bootstrap/release"
          fi
        }
        if [[ "${{ runner.os }}" == "macOS" ]] ; then
          bash misc/designer/fetch-tools.sh macos "build/bin/Nordtal Designer.app/Contents/Resources/data"
          release "build/bin/Nordtal Designer.app/Contents/Resources/data"
          ditto -c -k --keepParent "build/bin/Nordtal Designer.app" "${{ env.PACKAGE }}"
        else
          mkdir -p "package/Nordtal Designer"
          cp "build/bin/Nordtal Designer.exe" "package/Nordtal Designer/"
          cp -r build/bin/data "package/Nordtal Designer/"
          bash misc/designer/fetch-tools.sh windows "package/Nordtal Designer/data"
          release "package/Nordtal Designer/data"
          cd package && 7z a "../${{ env.PACKAGE }}" "Nordtal Designer"
        fi
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ env.PACKAGE }}
        path: ${{ env.PACKAGE }}
  # Runs no code of the repository: it attaches the packages the build
  # jobs made to the tag's release
  release:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: packages
        merge-multiple: true
    - name: Attach to the release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "" || true
        gh release upload "$GITHUB_REF_NAME" packages/*.zip --clobber
